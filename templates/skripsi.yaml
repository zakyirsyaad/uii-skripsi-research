# Konfigurasi PROYEK skripsi. Simpan sebagai `.skripsi.yaml` di root proyek.
#
# Berkas ini hanya memuat setelan yang berbeda antar proyek. Setelan yang
# melekat pada dirimu — email polite pool dan jalur basis data KBBI — ditanyakan
# sekali saat plugin dipasang, bukan di sini. Ubah kapan saja lewat:
#
#     /plugin configure uii-skripsi-research
#
schema_version: 1

# Identitas proyek. Bebas, tapi harus stabil — dipakai ledger untuk mencegah
# konteks satu proyek terbawa ke proyek lain.
project_id: skripsi-informatika-uii

# Batas kebaruan sumber empiris, dalam tahun. Yang dikecualikan otomatis hanya
# tipe `buku` dan `standar`. Teori atau metode mendasar yang terbit sebagai
# jurnal tetap ditandai audit, dan memang harus dijustifikasi terpisah.
recency_years: 5

# Porsi maksimum sumber non-akademik (tipe `artikel`) dalam daftar pustaka.
# Batas absolut dihitung floor(total_sumber * rasio).
article_cap_ratio: 0.20

# APA 6th. Ini BUKAN pilihan bebas: template resmi Informatika UII menyatakan
# "Jangan lupa gunakan format APA6th" — berlaku pada template 2020 (Indonesia)
# maupun 2025 (International Program).
citation_style: APA6

cache_dir: .skripsi-cache

# Override opsional, hanya bila proyek ini perlu berbeda dari setelan pluginmu.
# Biarkan tetap dikomentari agar nilai dari /plugin configure yang dipakai.
# mailto: ""
# kbbi_db_path: ""
